function toggleProjector(){
  projector = !projector;

function jumpVideo(t){
  const iframe = document.getElementById('mainVideo');
  if(iframe) iframe.src = `https://www.youtube.com/embed/g0RoLcCOqfE?start=${t}&autoplay=1`;
  document.querySelectorAll('.video-jump button').forEach(b=>b.removeAttribute('aria-current'));
  const btn = [...document.querySelectorAll('.video-jump button')].find(b=>Number(b.dataset.t)===t);
  if(btn) btn.setAttribute('aria-current','true');
}

/* =========================================================================
   事件委派
   ========================================================================= */
document.body.addEventListener('click', function(e){
  const gradeBtn = e.target.closest('#gradeSwitch button[data-grade], .grade-pick button[data-grade]');
  if(gradeBtn){ setGrade(gradeBtn.dataset.grade); return; }

  const projBtn = e.target.closest('#projToggle');
  if(projBtn){ toggleProjector(); return; }

  const pgBtn = e.target.closest('.tb-pages button[data-pg]');
  if(pgBtn){ currentTbPage = Number(pgBtn.dataset.pg); renderGuidePage(); return; }

  const zoneBtn = e.target.closest('.tb-zone[data-seg]');
  if(zoneBtn){ setSeg(zoneBtn.dataset.seg); return; }

  const segBtn = e.target.closest('.segnav button[data-seg]');
  if(segBtn){ setSeg(segBtn.dataset.seg); return; }

  const zoomBtn = e.target.closest('#zoomBtn');
  if(zoomBtn){ openLightbox(GRADES[currentGrade].pages[currentTbPage]); return; }

  const jumpBtn = e.target.closest('.video-jump button[data-t]');
  if(jumpBtn){ jumpVideo(Number(jumpBtn.dataset.t)); return; }

  const galleryBtn = e.target.closest('#openGallery12');
  if(galleryBtn){ openGallery12(); return; }

  const ansBtn = e.target.closest('#ex1AnswerToggle');
  if(ansBtn){
    const list = document.getElementById('ex1List');
    const show = list.classList.toggle('show-answers');
    ansBtn.textContent = show ? '隱藏解答' : '顯示解答';
    return;
  }

  if(e.target.closest('.modal-close') || e.target.classList.contains('modal-backdrop')){ closeModal(); return; }

  const gotoEl = e.target.closest('[data-goto]');
  if(gotoEl){ e.preventDefault(); go(gotoEl.dataset.goto); return; }
});

document.getElementById('pdfSyncNote').textContent = '內容依使用者提供之教案決議與 A & P／L & U／S & J 三份教材製作，詳見「教材與資源」頁之製作說明。';

/* 初始渲染 */
render();
